services:
  influxdb3:
    container_name: influxdb3
    image: influxdb:3.9.3-core
    ports:
      - 8181:8181
    env_file:
      - .env
    command:
      - influxdb3
      - serve
      - --node-id=${INFLUXDB_NODE_ID}
      - --object-store=file
      - --data-dir=/var/lib/influxdb3
      - --without-auth
    volumes:
      - influxdb_data:/var/lib/influxdb3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -H 'Authorization: Bearer ${INFLUXDB_TOKEN}' http://localhost:8181/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  aria_collector:
    container_name: aria_collector
    build: ./requirements/collector
    env_file:
      - .env
    environment:
      - ARIA_HOST=IPtoAria
      - ARIA_USER=changeme
      - ARIA_AUTH_SOURCE=local
      - ARIA_PASSWD=changeme
      - ARIA_RESOURCE_ID1=resourceIdVcenterServer1
      - MAP_ID1=nameOfResourceId1
      - ARIA_RESOURCE_ID2=resourceIdVcenterServer1
      - MAP_ID2=nameOfResourceId2
    depends_on:
      influxdb3:
        condition: service_healthy

  collector1:
    container_name: collector1
    build: ./requirements/collector
    env_file:
      - .env
    environment:
      - VCENTER_HOST=changeme
      - VCENTER_USER=user
      - VCENTER_PASSWD=passwd
      - DS_FOLDER=ds_folder
      - UNITY_HOST=changeme
      - UNITY_USER=changeme
      - UNITY_PASSWD=changeme
      - POWERSTORE_HOST=changeme
      - POWERSTORE_USER=changeme
      - POWERSTORE_PASSWD=changeme
    depends_on:
      influxdb3:
        condition: service_healthy

  collector2:
    container_name: collector2
    build: ./requirements/collector
    env_file:
      - .env
    environment:
      - VCENTER_HOST=changeme
      - VCENTER_USER=user
      - VCENTER_PASSWD=passwd
      - DS_FOLDER=ds_folder
      - UNITY_HOST=changeme
      - UNITY_USER=changeme
      - UNITY_PASSWD=changeme
      - POWERSTORE_HOST=changeme
      - POWERSTORE_USER=changeme
      - POWERSTORE_PASSWD=changeme
    depends_on:
      influxdb3:
        condition: service_healthy

  grafana:
    image: grafana/grafana
    container_name: grafana
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${ADMIN}
      - GF_SECURITY_ADMIN_PASSWORD=${PASSW}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_PROTOCOL=http
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./requirements/grafana/conf:/etc/grafana/provisioning
    depends_on:
      influxdb3:
        condition: service_healthy
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana_data:
